# Production mappings are dimension-based. Candidate labels are explicit so schema changes fail loudly.
real_gdp:
  source: statcan
  product_id: 36100434
  unit: dollars
  transform: latest
  filters:
    GEO: Canada
  optional: true
unemployment:
  source: statcan
  product_id: 14100287
  unit: percent
  transform: latest
  filters:
